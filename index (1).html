                    <div class="flex justify-between items-start z-10">
              
                        <span class="text-sm font-bold text-slate-400 group-hover:text-white transition">${node.name}</span>
                        <i id="jitter-${index}" class="fa-solid fa-chart-line text-[10px] text-orange-400 opacity-0 transition" title="线路抖动检测"></i>
                    </div>
                    <div class="flex items-center gap-2 mt-3 z-10">
        
                        <div class="ping-dot bg-slate-600 transition-colors" id="dot-${index}"></div>
                        <span class="font-mono text-base font-bold text-slate-500 transition-colors" id="text-${index}">等待检测...</span>
                    </div>
                    <div class="absolute -bottom-3 -right-1 text-5xl font-bold text-slate-800/40 select-none group-hover:text-slate-700/40 transition 
pointer-events-none">${i}</div>
                </a>`;
            });
            container.innerHTML = html;
            
            // 4. 启动自动检测
            setTimeout(checkAllNodes, 500);
        }
        //跳转页面带路径跳转
        function getAffiliateCode() {
            // 情况 1：#/register?code=xxx
            if (window.location.hash && window.location.hash.includes('?')) {
                const hashQuery = window.location.hash.split('?')[1];
                const hashParams = new URLSearchParams(hashQuery);
                const codeFromHash = hashParams.get('code');
            if (codeFromHash) return codeFromHash;
        }

            // 情况 2：?code=xxx
            const searchParams = new URLSearchParams(window.location.search);
            return searchParams.get('code');
        }
        // ================= 核心测速逻辑 =================
        function checkAllNodes() {
            if (refreshTimer) clearTimeout(refreshTimer);
            refreshIcon.classList.add('fa-spin');
            systemStatusText.innerText = "正在实时探测...";
            
            currentStats = { total: nodes.length, completed: 0, active: 0, totalLatency: 0 };
            
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            setTimeout(() => {
                if(autoRefresh) {
                    timerBar.style.transition = `width ${REFRESH_INTERVAL/1000}s linear`;
                    timerBar.style.width = '0%';
                }
            }, 50);
            nodes.forEach((node, index) => {
                const card = document.getElementById(`card-${index}`);
                const dot = document.getElementById(`dot-${index}`);
                const text = document.getElementById(`text-${index}`);
                
                card.classList.remove('fastest', 'offline');
       
                text.innerText = "检测中...";
                text.className = "font-mono text-sm font-bold text-slate-400";
                dot.className = "ping-dot bg-slate-500 animate-pulse";
                // 暂时重置延迟数据
                card.setAttribute('data-latency', '8888');

              
                setTimeout(() => {
                    checkSingleNode(node, index);
                }, index * STAGGER_DELAY);
            });
        }

        function checkSingleNode(node, index) {
            const card = document.getElementById(`card-${index}`);
            const dot = document.getElementById(`dot-${index}`);
            const text = document.getElementById(`text-${index}`);
            const jitterIcon = document.getElementById(`jitter-${index}`);

            const startTime = performance.now();
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);
            // 测速使用纯净的原始 URL (node.url)，不带任何参数，确保测速准确
            // 为了防止缓存，添加时间戳
            const targetUrl = `${node.url}/generate_204?t=${Date.now()}`;
            fetch(targetUrl, { 
                method: 'HEAD', 
                mode: 'no-cors', 
                cache: 'no-store',
                credentials: 'include', 
                signal: controller.signal 
         
            })
            .then(() => {
                clearTimeout(timeoutId);
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);
                
           
                // 1. 记录历史并检测抖动
                // 注意：如果 history 属性不存在会报错，请确保 nodes 数组中初始化了 history: []
                node.history.push(latency);
                if (node.history.length > 3) node.history.shift(); // 只保留最近3次

                // 计算抖动
               
                if (node.history.length >= 2) {
                    const prevLatency = node.history[node.history.length - 2];
                    const change = Math.abs(latency - prevLatency) / prevLatency;
                    if (change > 0.5) {
                   
                        jitterIcon.classList.remove('opacity-0'); // 显示抖动图标
                        jitterIcon.classList.add('animate-pulse');
                    } else {
                        jitterIcon.classList.add('opacity-0');
                        jitterIcon.classList.remove('animate-pulse');
                    }
                }

                // 2. 更新 UI
                text.innerText = latency + "ms";
                card.setAttribute('data-latency', latency); 
                
                if(latency < 200) {
                    text.className = "font-mono text-sm font-bold text-green-400 status-fast";
                    dot.className = "ping-dot bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]";
                    if(latency < 100) card.classList.add('fastest');
                } else if (latency < 500) {
                    text.className = "font-mono text-sm font-bold text-yellow-400 status-med";
                    dot.className = "ping-dot bg-yellow-500";
                } else {
                    text.className = "font-mono text-sm font-bold text-red-400 status-slow";
                    dot.className = "ping-dot bg-red-500";
                }

                currentStats.active++;
                currentStats.totalLatency += latency;
            })
            .catch(() => {
                text.innerText = "超时";
                text.className = "font-mono text-sm font-bold text-slate-500 status-offline";
                dot.className = "ping-dot bg-red-600";
                card.classList.add('offline');
        
                card.setAttribute('data-latency', '9999'); 
                
                // 重置历史
                node.history = []; 
                jitterIcon.classList.add('opacity-0');
            })
          
            .finally(() => {
                currentStats.completed++;
                updateHeaderStats();
                
                // 全部跑完
                if(currentStats.completed === currentStats.total) {
            
                    refreshIcon.classList.remove('fa-spin');
                    
                    // 【已移除自动排序调用】
                    // setTimeout(sortNodesByLatency, 800);

                    if(autoRefresh) {
        
                        refreshTimer = setTimeout(checkAllNodes, REFRESH_INTERVAL);
                    }
                }
            });
        }

        // ================= 自动排序功能 (已禁用) =================
        function sortNodesByLatency() {
            const cards = Array.from(container.children);
            cards.sort((a, b) => {
                const latA = parseInt(a.getAttribute('data-latency')) || 9999;
                const latB = parseInt(b.getAttribute('data-latency')) || 9999;
                return latA - latB;
            });
            cards.forEach(card => container.appendChild(card));
        }

        // ================= 一键直连 =================
        function visitFastestNode() {
            const cards = Array.from(container.children);
            let bestCard = null;
            let minLatency = 9999;

            cards.forEach(card => {
                const lat = parseInt(card.getAttribute('data-latency'));
                if (lat < minLatency && lat > 0) {
                    minLatency = lat;
                    bestCard = card;
   
                }
            });
            if (bestCard && minLatency < 2000) {
                const url = bestCard.getAttribute('href');
                showToast(`🚀 正在前往最快节点 (${minLatency}ms)`);
                setTimeout(() => {
                    window.open(url, '_blank');
                }, 1000);
            } else {
                showToast('⚠️ 暂无可用高速节点，请稍后');
            }
        }

        // ================= 更新统计 =================
        function updateHeaderStats() {
            const count = currentStats.active;
            const avg = count > 0 ? Math.round(currentStats.totalLatency / count) : 0;
            const rate = Math.round((count / nodes.length) * 100);
            onlineCountEl.innerText = count;
            avgLatencyEl.innerText = count > 0 ? avg + "ms" : "N/A";
            onlineRateEl.innerText = rate + "%";
            if(avg < 100 && count > 0) avgLatencyEl.className = "text-2xl font-bold text-green-400";
            else if (avg < 300 && count > 0) avgLatencyEl.className = "text-2xl font-bold text-yellow-400";
            else avgLatencyEl.className = "text-2xl font-bold text-slate-400";
            if(currentStats.completed === currentStats.total) {
                if(count >= 10) {
                    systemStatusText.innerText = "系统运行正常";
                    statusIcon.className = "fa-solid fa-heart-pulse text-green-400 text-lg animate-pulse";
                    statusIconBg.className = "w-10 h-10 rounded-full bg-green-500/10 flex items-center justify-center shrink-0";
                } else if (count >= 5) {
                    systemStatusText.innerText = "部分线路拥堵";
                    statusIcon.className = "fa-solid fa-triangle-exclamation text-yellow-400 text-lg";
                    statusIconBg.className = "w-10 h-10 rounded-full bg-yellow-500/10 flex items-center justify-center shrink-0";
                } else {
                    systemStatusText.innerText = "系统维护中";
                    statusIcon.className = "fa-solid fa-skull text-red-500 text-lg";
                    statusIconBg.className = "w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center shrink-0";
                }
            }
        }

        // ================= 辅助功能 =================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            msgEl.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function copyText(event, text) {
            event.preventDefault();
            event.stopPropagation();
            navigator.clipboard.writeText(text).then(() => {
                showToast(`已复制: ${text}`);
            }).catch(() => {
                showToast('复制失败，请手动复制');
            });
        }

        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('auto-btn');
            const icon = btn.querySelector('i');
            
            if(autoRefresh) {
                icon.className = "fa-solid fa-pause";
                checkAllNodes();
            } else {
                icon.className = "fa-solid fa-play";
                clearTimeout(refreshTimer);
                refreshIcon.classList.remove('fa-spin');
                timerBar.style.width = '100%';
            }
        }

        // ================= URL 自定义背景（仅 URL） =================
        function sanitizeImageUrl(raw) {
            if (!raw || typeof raw !== 'string') return null;
            try {
                const url = new URL(raw, window.location.origin);
                if (!['http:', 'https:'].includes(url.protocol)) return null;
                return url.href;
            } catch {
                return null;
            }
        }

        function applyCustomBackgroundFromUrl() {
            const safeUrl = sanitizeImageUrl(window.BG_IMAGE_URL || '');
            const overlay = Number(window.BG_OVERLAY_OPACITY);

            if (!Number.isNaN(overlay) && overlay >= 0 && overlay <= 1) {
                document.documentElement.style.setProperty('--bg-overlay-opacity', String(overlay));
            }

            if (safeUrl) {
                document.documentElement.style.setProperty('--custom-bg-image', `url("${safeUrl}")`);
            }
        }

        window.onload = () => {
            applyCustomBackgroundFromUrl();
            initHtml();
        };
    </script>
</body>
</html>
